name: CI

# Two lanes in parallel, so the wall time is the slower lane, not the sum:
#   build: the full build-all.sh (generators, packages, solvers, every toolbox command with stock tools and
#          PowerShell, site, contrast, bundle leak check, server and client tests);
#   e2e:   the Playwright suite split into 4 shards. Each shard builds only what its local server needs
#          (build-all.sh --e2e-prep) and runs on its own fresh, unseeded server, so tests that change shared
#          state (schedule, accounts) never meet across shards. Blob reports merge into one HTML report.
# Docs-only changes skip CI (nothing on main requires these checks).
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, solvers, command checks, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Node 24: `node --test --experimental-strip-types` (server tests, local server) works there.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install system tools (zip, GNU awk for the POSIX-awk check)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip gawk

      - name: Configure git identity for the generated case repos
        run: |
          git config --global user.name "IncidentLab CI"
          git config --global user.email "ci@incidentlab.invalid"
          git config --global init.defaultBranch main

      - name: Full build (generators, answer keys, packaging, solvers, commands, site, server tests)
        run: ./scripts/build-all.sh

  e2e:
    name: E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "true"
      E2E_PORT: "8888"
      E2E_BASE_URL: http://localhost:8888
      # Throwaway key for the in-memory local server only (never a real secret).
      ADMIN_KEY: ci-admin-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            tests/e2e/package-lock.json

      - name: Install system tools and git identity
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip gawk
          git config --global user.name "IncidentLab CI"
          git config --global user.email "ci@incidentlab.invalid"
          git config --global init.defaultBranch main

      - name: Build what the local server needs (evidence, case packages, site)
        run: ./scripts/build-all.sh --e2e-prep

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci

      # The browser download is cached per Playwright version (the lockfile); system libraries are still
      # installed every run, which guards against runner image changes and costs little.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}

      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system libraries (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: tests/e2e
        run: npx playwright install-deps chromium

      - name: Start local server
        run: |
          # The server uploads and publishes every build/packages/*.case.zip at startup (the site has no bundled
          # cases since #68). --seed-db-case adds db-demo for tests/e2e/db-cases.spec.ts.
          node --experimental-strip-types tests/local-server.ts "$E2E_PORT" --seed-db-case > local-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$E2E_BASE_URL/api/today" > /dev/null; then
              echo "local server is up"
              exit 0
            fi
            sleep 1
          done
          echo "local server did not come up" >&2
          cat local-server.log >&2
          exit 1

      - name: End-to-end tests (Playwright, shard ${{ matrix.shard }}/4)
        working-directory: tests/e2e
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: tests/e2e/blob-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshots, traces and server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            tests/e2e/test-results/
            local-server.log
          retention-days: 14
          if-no-files-found: ignore

  e2e-report:
    name: E2E report
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        working-directory: tests/e2e
        run: npx playwright merge-reports --reporter html ../../all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14
