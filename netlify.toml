# IncidentLab — Netlify config
#
# Why no real build command here?
# The pipeline (generator/*.py -> scripts/make_flags.py -> scripts/package.sh -> vite build)
# needs Python 3, git and zip, and it bakes per-build random salts into the flags. Netlify's
# build image may not ship a matching Python/git setup, and rebuilding on every push would
# reshuffle salts and regenerate the evidence pack. So we build locally and deploy the
# PREBUILT output:
#
#   ./scripts/deploy.sh      (build-all.sh + netlify deploy --prod with the /api Function)
#
# Answer checking lives in ONE Netlify Function (site/netlify/functions, served at /api/*),
# backed by Netlify Blobs. The answer key (site/server/generated/secrets.json) is bundled into
# the function only and is never published to site/dist.

[build]
  publish = "site/dist"
  edge_functions = "site/netlify/edge-functions"
  command = "echo 'prebuilt: run scripts/build-all.sh locally, then netlify deploy --dir=site/dist'"

[functions]
  directory = "site/netlify/functions"
  node_bundler = "esbuild"
  # The Edge Function's npm imports (zod, @netlify/blobs) are resolved by Netlify's edge bundler from the
  # repo root's node_modules, so they are pinned in the root package.json (deploy.sh runs npm ci there).
  # An import map with npm: specifiers does NOT work: the bundler can't load them ("Module not found").

# DB-stored evidence (#64): an Edge Function streams the 4 MiB chunks from Blobs, with Range support, so
# files past the Function payload limits (40 MB today) work. Its own prefix, so the static /evidence/*
# files below are untouched. A returned response ends the request, so the SPA rewrite never applies here.
# No `cache = "manual"`: the CDN does not cache it; browsers do (immutable, the URL carries the version).
[[edge_functions]]
  path = "/evidence/db/*"
  function = "evidence"

# SPA fallback: client-side routes (e.g. /cases/3am-outage) serve index.html.
# Real files (assets, the evidence zip) still win because force = false.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Vite emits content-hashed filenames under /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The evidence zip is not content-hashed; keep it revalidating so a rebuild is picked up.
[[headers]]
  for = "/evidence/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify applies [[headers]] only to files it serves itself, NOT to Function or Edge Function responses,
# so neither this rule nor the /evidence/* one above reaches /api/* or /evidence/db/*. Those set their own
# headers in code: http.ts sends no-store on every /api route except the two public content routes
# (GET /api/cases, GET /api/cases/:id/content: public, max-age=60, stale-while-revalidate=600, ETag);
# evidenceStream.ts sends immutable caching plus nosniff and a sandbox CSP. Kept as a safety net.
# API responses are per-player and must never be cached.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
