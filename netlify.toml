# IncidentLab — Netlify config
#
# Why no real build command here?
# The pipeline (generator/*.py -> scripts/make_flags.py -> scripts/package.sh -> vite build)
# needs Python 3, git and zip, and it bakes per-build random salts into the flags. Netlify's
# build image may not ship a matching Python/git setup, and rebuilding on every push would
# reshuffle salts and regenerate the evidence pack. So we build locally and deploy the
# PREBUILT output:
#
#   ./scripts/deploy.sh      (build-all.sh + netlify deploy --prod with the /api Function)
#
# Answer checking lives in ONE Netlify Function (site/netlify/functions, served at /api/*),
# backed by Netlify Blobs. Since #68 every case (content, answer key, evidence) lives in Blobs and is
# uploaded as a case package (scripts/data.ts upload --publish): neither site/dist nor the function
# bundle carries any case, and a deploy never changes one.

[build]
  publish = "site/dist"
  edge_functions = "site/netlify/edge-functions"
  command = "echo 'prebuilt: run scripts/build-all.sh locally, then netlify deploy --dir=site/dist'"

[functions]
  directory = "site/netlify/functions"
  node_bundler = "esbuild"
  # The Edge Function's npm imports (zod, @netlify/blobs) are resolved by Netlify's edge bundler from the
  # repo root's node_modules, so they are pinned in the root package.json (deploy.sh runs npm ci there).
  # An import map with npm: specifiers does NOT work: the bundler can't load them ("Module not found").

# DB-stored evidence (#64): an Edge Function streams the 4 MiB chunks from Blobs, with Range support, so
# files past the Function payload limits (40 MB today) work. It is the only evidence path (#68): the site
# publishes no static evidence. A returned response ends the request, so the SPA rewrite never applies here.
# `cache = "manual"` (#141): the CDN caches what the function marks cacheable through Netlify-CDN-Cache-Control,
# which is complete GET 200s only (the URL carries the version, files never change in place). Partial (206),
# HEAD, 304, 416 and 404 responses are no-store, so a cached partial is never served whole. Later loads skip the
# function and the Blobs reads entirely.
[[edge_functions]]
  path = "/evidence/db/*"
  function = "evidence"
  cache = "manual"

# A missing build file is a real 404 (#208), never the SPA page. Without this rule a chunk from an older deploy
# came back as `200 text/html` under the immutable /assets/* header below, so the browser cached a broken module
# for a year. force = false, so this only applies when no file exists at the path ("shadowing": Netlify serves an
# existing file before any non-forced rule). Rules run top to bottom, first match wins, so it must stay above the
# SPA fallback. The body is plain text, not HTML: [[headers]] for /assets/* may still be attached to it, and no HTML
# document may ever be served under that header. The client reloads once when a chunk fails (main.ts).
[[redirects]]
  from = "/assets/*"
  to = "/asset-missing.txt"
  status = 404
  force = false

# SPA fallback. Routes are hash-based (#/case/<id>), so this is not needed for routing; it keeps a page up for a
# mistyped or old path-style link, and share links built from `location.pathname` keep working. It never reaches
# /api/* (the Function matches first) or /evidence/db/* (the Edge Function returns a response, ending the chain).
# Real files win because force = false.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Vite emits content-hashed filenames under /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify applies [[headers]] only to files it serves itself, NOT to Function or Edge Function responses,
# so this rule never reaches /api/* or /evidence/db/*. Those set their own
# headers in code: http.ts sends no-store on every /api route except the two public content routes
# (GET /api/cases, GET /api/cases/:id/content: public, max-age=60, stale-while-revalidate=600, ETag);
# evidenceStream.ts sends immutable caching plus nosniff and a sandbox CSP. Kept as a safety net.
# API responses are per-player and must never be cached.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
