<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IncidentLab: CTF-style puzzles built from real-world incidents. Real evidence, real tools, your RCA." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f9fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://incidentlab-3am-outage.netlify.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Interface text uses the system font (no download); Plex Mono for code loads on demand. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IncidentLab" />
    <meta property="og:title" content="IncidentLab: work a real outage, end to end" />
    <meta property="og:description" content="CTF-style puzzles built from real-world incidents. Real evidence, real tools, your root cause." />
    <meta property="og:url" content="https://incidentlab-3am-outage.netlify.app/" />
    <meta property="og:image" content="https://incidentlab-3am-outage.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="IncidentLab logo with the line: Work a real outage, end to end, beside a terminal showing a solved case." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IncidentLab: work a real outage, end to end" />
    <meta name="twitter:description" content="CTF-style puzzles built from real-world incidents. Real evidence, real tools, your root cause." />
    <meta name="twitter:image" content="https://incidentlab-3am-outage.netlify.app/og-image.png" />
    <meta name="twitter:image:alt" content="IncidentLab logo with the line: Work a real outage, end to end, beside a terminal showing a solved case." />
    <title>IncidentLab</title>
    <!-- Applies the saved display settings (theme, text size, motion, contrast, spacing) before first paint.
         A classic external script: the CSP (script-src 'self') blocks inline ones. -->
    <script src="/settings-boot.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <!-- App shell grid: navbar, announcement, sidebar, main, footer. -->
    <div class="shell">
      <header class="navbar">
        <div class="navbar-row">
          <a class="logo mono" href="#/" aria-label="IncidentLab home"><span class="logo-mark" aria-hidden="true">▲</span> incident<span class="accent">lab</span></a>
          <!-- src/shell/navbar.ts adds: menu button, navigation, account menu, language toggle, ⚙ settings -->
        </div>
        <div class="live-strip" role="group" hidden>
          <div class="live-strip-inner">
            <span class="topbar-status mono is-off" aria-hidden="true"><span class="dot"></span> on-call: you</span>
            <!-- src/shell/liveStrip.ts adds: today's case and countdown, event clock, connectivity -->
          </div>
        </div>
      </header>
      <!-- Per-page sidebar (src/shell/sidebar.ts). html[data-sidebar-page] (set by settings-boot.js) reserves it. -->
      <aside id="sidebar" class="sidebar"></aside>
      <main class="shell-main">
        <!-- Page header slot: the phone sidebar button and a view's optional header (src/shell/sidebar.ts). -->
        <div class="page-header"></div>
        <div id="app" tabindex="-1">
          <!-- Static first paint until main.ts renders the route (replaced on the first render). -->
          <section class="center-card" aria-busy="true"><p class="muted mono">Loading…</p></section>
        </div>
      </main>
      <footer class="footer mono"><span class="footer-tagline">IncidentLab · fictional companies, real failure modes · built for engineers who like a good outage</span> · <a href="/accessibility.html">Accessibility · <span lang="he" dir="rtl">נגישות</span></a></footer>
    </div>
    <noscript>IncidentLab needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
